<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Ilustrasi paket perjalanan haji">
  <defs>
    <linearGradient id="hajiBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#105c43"/>
      <stop offset="1" stop-color="#1f805d"/>
    </linearGradient>
    <linearGradient id="hajiGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2e3b8"/>
      <stop offset="1" stop-color="#d9b96e"/>
    </linearGradient>
    <pattern id="hajiPattern" width="56" height="56" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M28 0 L56 28 L28 56 L0 28 Z" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.2"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#hajiBg)"/>
  <rect width="800" height="600" fill="url(#hajiPattern)"/>
  <circle cx="650" cy="110" r="150" fill="#d9b96e" opacity="0.12"/>
  <circle cx="150" cy="500" r="190" fill="#ffffff" opacity="0.06"/>

  <!-- Ka'bah -->
  <g transform="translate(300 250)">
    <rect x="0" y="0" width="200" height="200" fill="#0c2f26" stroke="url(#hajiGold)" stroke-width="4"/>
    <rect x="0" y="40" width="200" height="22" fill="url(#hajiGold)" opacity="0.9"/>
    <rect x="0" y="70" width="200" height="6" fill="url(#hajiGold)" opacity="0.45"/>
    <rect x="0" y="200" width="200" height="14" fill="#e7d9b6" opacity="0.8"/>
    <rect x="80" y="130" width="40" height="70" fill="url(#hajiGold)" opacity="0.9"/>
    <path d="M80 130 h40 v70 h-40 z" fill="none" stroke="#0c2f26" stroke-width="2"/>
  </g>

  <!-- Ornamen lengkungan -->
  <path d="M90 560 v-160 a70 70 0 0 1 140 0 v160" fill="none" stroke="url(#hajiGold)" stroke-width="3" opacity="0.55"/>
  <path d="M570 560 v-160 a70 70 0 0 1 140 0 v160" fill="none" stroke="url(#hajiGold)" stroke-width="3" opacity="0.55"/>
  <g fill="url(#hajiGold)" opacity="0.7">
    <circle cx="160" cy="210" r="10"/>
    <circle cx="640" cy="210" r="10"/>
    <rect x="150" y="225" width="20" height="40" rx="8"/>
    <rect x="630" y="225" width="20" height="40" rx="8"/>
  </g>

  <text x="400" y="540" font-family="Segoe UI, system-ui, sans-serif" font-size="30" font-weight="700" fill="#f7f8f3" text-anchor="middle" letter-spacing="3">HAJI</text>
</svg>
