<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Ilustrasi suasana Masjidil Haram">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b3d2d"/>
      <stop offset="0.55" stop-color="#105c43"/>
      <stop offset="1" stop-color="#1f805d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0dca8"/>
      <stop offset="1" stop-color="#d9b96e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="72%" r="55%">
      <stop offset="0" stop-color="#f3e2b6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f3e2b6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="geo" width="80" height="80" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="80" height="80" fill="none"/>
      <path d="M40 0 L80 40 L40 80 L0 40 Z" fill="none" stroke="#d9b96e" stroke-opacity="0.22" stroke-width="1.4"/>
      <circle cx="40" cy="40" r="9" fill="none" stroke="#d9b96e" stroke-opacity="0.18" stroke-width="1.2"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>
  <rect width="1200" height="800" fill="url(#geo)"/>
  <circle cx="640" cy="600" r="420" fill="url(#glow)"/>

  <g fill="#e9dcc0" opacity="0.5">
    <circle cx="180" cy="130" r="2.4"/>
    <circle cx="320" cy="90" r="1.8"/>
    <circle cx="880" cy="110" r="2.2"/>
    <circle cx="1040" cy="180" r="1.6"/>
    <circle cx="520" cy="70" r="1.5"/>
    <circle cx="720" cy="150" r="1.9"/>
  </g>

  <!-- Bulan sabit -->
  <g transform="translate(300 170)">
    <circle r="46" fill="url(#gold)" opacity="0.9"/>
    <circle cx="18" cy="-8" r="42" fill="#105c43"/>
  </g>

  <!-- Siluet masjid -->
  <g fill="#0a3327">
    <rect x="0" y="540" width="1200" height="260"/>
    <rect x="150" y="430" width="70" height="330" rx="6"/>
    <rect x="980" y="430" width="70" height="330" rx="6"/>
    <rect x="250" y="470" width="700" height="290" rx="10"/>
    <path d="M420 470 q80 -120 160 0 z" opacity="0.95"/>
    <path d="M630 470 q85 -145 170 0 z" opacity="0.95"/>
    <!-- Menara -->
    <g>
      <rect x="596" y="250" width="26" height="220"/>
      <path d="M609 200 l26 52 h-52 z"/>
      <circle cx="609" cy="196" r="9"/>
      <rect x="586" y="330" width="46" height="14" rx="6"/>
      <rect x="586" y="300" width="46" height="10" rx="5"/>
    </g>
    <!-- Lengkungan -->
    <g fill="none" stroke="#d9b96e" stroke-opacity="0.5" stroke-width="3">
      <path d="M300 760 v-150 a40 40 0 0 1 80 0 v150"/>
      <path d="M420 760 v-150 a40 40 0 0 1 80 0 v150"/>
      <path d="M540 760 v-150 a40 40 0 0 1 80 0 v150"/>
      <path d="M660 760 v-150 a40 40 0 0 1 80 0 v150"/>
      <path d="M780 760 v-150 a40 40 0 0 1 80 0 v150"/>
      <path d="M900 760 v-150 a40 40 0 0 1 80 0 v150"/>
    </g>
    <g fill="#d9b96e" opacity="0.35">
      <rect x="170" y="450" width="30" height="8" rx="4"/>
      <rect x="1000" y="450" width="30" height="8" rx="4"/>
    </g>
  </g>

  <!-- Garis kubah -->
  <g fill="none" stroke="url(#gold)" stroke-width="2.5" opacity="0.65">
    <path d="M420 470 q80 -120 160 0"/>
    <path d="M630 470 q85 -145 170 0"/>
    <path d="M632 325 q85 -145 166 0" transform="translate(0 0)"/>
    <line x1="255" y1="500" x2="945" y2="500"/>
  </g>
</svg>
